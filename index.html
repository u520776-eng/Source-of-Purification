<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>淨化之源：海天一色 | Zen Purify Pro</title>
    <!-- 載入 React 運行環境 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&family=Noto+Serif+TC:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --sea-deep: #082f49; --sea-light: #0c4a6e; --sky-light: #7dd3fc; }
        body { margin: 0; overflow: hidden; user-select: none; font-family: 'Noto Sans TC', sans-serif; background: var(--sea-light); height: 100vh; width: 100vw; }
        
        .main-gradient {
            position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(180deg, var(--sky-light) 0%, var(--sea-light) 60%, var(--sea-deep) 100%);
        }

        /* 聖火粒子：美化版 */
        @keyframes fire-organic { 
            0% { transform: translateY(0) scale(1) translateX(0); opacity: 0; } 
            15% { opacity: 0.8; filter: blur(1px) brightness(1.8); } 
            50% { transform: translateY(-400px) scale(1.8) translateX(25px); opacity: 0.7; }
            100% { transform: translateY(-900px) scale(0.6) translateX(-30px) rotate(45deg); opacity: 0; } 
        }
        .fire-node { 
            animation: fire-organic 3.8s infinite ease-out; 
            position: absolute; bottom: -80px; 
            filter: drop-shadow(0 0 25px rgba(249, 115, 22, 0.4));
        }

        /* 黑洞轉化環 */
        @keyframes bh-spin { 
            0% { transform: rotate(0deg) scale(1.1); filter: blur(0); } 
            100% { transform: rotate(-7200deg) scale(0); filter: blur(120px); } 
        }
        .bh-vortex { animation: bh-spin 6s forwards cubic-bezier(0.4, 0, 1, 0.2); }
        
        .golden-horizon { 
            position: absolute; inset: 0; border-radius: 60px;
            box-shadow: 0 0 120px rgba(212, 175, 55, 0.5), inset 0 0 80px rgba(212, 175, 55, 0.2);
            opacity: 0; transition: opacity 2s ease; pointer-events: none; z-index: 5;
        }
        .horizon-active { opacity: 1; }

        .glass { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(50px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .altar-grid { border-radius: 60px; position: relative; overflow: hidden; }
        
        .serif-font { font-family: 'Noto Serif TC', serif; }
        
        @keyframes zen-emerge {
            0% { opacity: 0; transform: scale(0.98); filter: blur(15px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); }
        }
        .fade-in-quote { animation: zen-emerge 4s forwards cubic-bezier(0.4, 0, 0.2, 1); }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .tab-active { background: white !important; color: #0369a1 !important; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        
        /* 語音波紋 */
        @keyframes ripple-scale { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(3); opacity: 0; } }
        .mic-ripple { animation: ripple-scale 1.5s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        // SVG 圖標組件
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                wind: <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2M9.6 4.6A2 2 0 1 1 11 8H2M12.6 19.4A2 2 0 1 0 14 16H2" />,
                type: <path d="M4 7V4h16v3M9 20h6M12 4v16" />,
                pencil: <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />,
                image: <><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></>,
                mic: <><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></>,
                flame: <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 3.5 3 5.5a7 7 0 1 1-14 0" />,
                orbit: <><circle cx="12" cy="12" r="3"/><path d="M3.85 19.07a2 2 0 0 1-1.4-3.53l1.41-1.41a2 2 0 1 1 2.83 2.83"/></>,
                play: <polygon points="5 3 19 12 5 21 5 3" />,
                pause: <><rect width="4" height="16" x="6" y="4"/><rect width="4" height="16" x="14" y="4"/></>,
                x: <line x1="18" y1="6" x2="6" y2="18" />,
                eraser: <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.9-9.9c1-1 2.5-1 3.4 0l6.6 6.6c1 1 1 2.5 0 3.4L13 21Z" />,
                left: <polyline points="15 18 9 12 15 6" />,
                upload: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></>,
            };
            return (
                <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        // 聖火粒子單元
        const FireParticle = ({ style }) => (
            <svg viewBox="0 0 100 150" className="fire-node" style={style}>
                <defs>
                    <radialGradient id="hFire" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stopColor="#fff" />
                        <stop offset="20%" stopColor="#fef3c7" />
                        <stop offset="50%" stopColor="#fbbf24" />
                        <stop offset="85%" stopColor="#ef4444" stopOpacity="0" />
                    </radialGradient>
                </defs>
                <path d="M50 0 C75 50 95 85 95 115 A45 45 0 0 1 5 115 C5 85 25 50 50 0" fill="url(#hFire)" />
            </svg>
        );

        function App() {
            // --- 狀態 ---
            const [mode, setMode] = useState('text');
            const [text, setText] = useState('');
            const [img, setImg] = useState(null);
            const [drawn, setDrawn] = useState(false);
            const [brush, setBrush] = useState('#ffffff');
            const [tools, setTools] = useState(['burn']);
            const [progress, setProgress] = useState(0); 
            const [status, setStatus] = useState('input'); // input, purifying, finished
            const [recording, setRecording] = useState(false);
            const [zen, setZen] = useState({ cn: '', en: '' });

            const canvasRef = useRef(null);
            const recognition = useRef(null);
            const timer = useRef(null);

            const quotes = [
                { cn: "海天無際，心歸寂靜。", en: "Boundless sea, mind returns to silence." },
                { cn: "浪花散去，此刻清明。", en: "Waves disperse, returning to clarity." },
                { cn: "萬象皆空，本性自如。", en: "All is void, nature remains free." },
                { cn: "清空重負，自由呼吸。", en: "Emptying the weight, breathe in freedom." },
                { cn: "執著消融，一念覺醒。", en: "Attachments dissolve, awakening now." }
            ];

            const colors = ['#ffffff', '#fbbf24', '#f87171', '#34d399', '#60a5fa'];

            // 語音邏輯
            const handleVoice = () => {
                const API = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!API) return;
                if (!recognition.current) {
                    const rec = new API();
                    rec.continuous = true; rec.lang = 'zh-TW';
                    rec.onresult = (e) => {
                        const t = Array.from(e.results).map(r => r[0].transcript).join('');
                        setText(t);
                    };
                    rec.onend = () => setRecording(false);
                    recognition.current = rec;
                }
                if (recording) recognition.current.stop();
                else {
                    setText(''); recognition.current.start();
                    setRecording(true); setMode('voice');
                }
            };

            // 畫布疊加
            const setupCanvas = useCallback(() => {
                const cvs = canvasRef.current;
                if (cvs) {
                    const parent = cvs.parentElement;
                    if (cvs.width !== parent.offsetWidth) {
                        cvs.width = parent.offsetWidth;
                        cvs.height = parent.offsetHeight;
                    }
                    const ctx = cvs.getContext('2d');
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 15;
                }
            }, []);

            useEffect(() => {
                if (mode === 'draw' && status === 'input') {
                    const t = setTimeout(setupCanvas, 150);
                    return () => clearTimeout(t);
                }
            }, [mode, status, setupCanvas]);

            const startDraw = (e) => {
                const cvs = canvasRef.current; if (!cvs) return;
                setDrawn(true);
                const rect = cvs.getBoundingClientRect();
                const ctx = cvs.getContext('2d');
                ctx.strokeStyle = brush;
                const getX = (ev) => (ev.clientX || ev.touches?.[0].clientX) - rect.left;
                const getY = (ev) => (ev.clientY || ev.touches?.[0].clientY) - rect.top;
                ctx.beginPath(); ctx.moveTo(getX(e), getY(e));
                const moving = (me) => { ctx.lineTo(getX(me), getY(me)); ctx.stroke(); };
                const stop = () => {
                    window.removeEventListener('mousemove', moving);
                    window.removeEventListener('mouseup', stop);
                    window.removeEventListener('touchmove', moving);
                    window.removeEventListener('touchend', stop);
                };
                window.addEventListener('mousemove', moving);
                window.addEventListener('mouseup', stop);
                window.addEventListener('touchmove', moving, { passive: false });
                window.addEventListener('touchend', stop);
            };

            // 6秒淨化儀式
            const beginPurify = () => {
                setStatus('purifying');
                timer.current = setInterval(() => {
                    setProgress(prev => {
                        const ticks = 120 / tools.length; // 6秒儀式
                        const inc = 100 / ticks;
                        const next = prev + inc;
                        if (next >= 100) {
                            clearInterval(timer.current);
                            setZen(quotes[Math.floor(Math.random() * quotes.length)]);
                            setStatus('finished');
                            return 100;
                        }
                        return next;
                    });
                }, 50);
            };

            const reset = () => {
                clearInterval(timer.current);
                setProgress(0); setText(''); setImg(null); setDrawn(false);
                setStatus('input'); setMode('text');
            };

            const canStart = () => (mode === 'text' || mode === 'voice') ? text.trim() : (mode === 'draw' ? drawn : img);

            return (
                <div className="h-screen w-full flex flex-col relative overflow-hidden">
                    <div className="main-gradient" />

                    {/* Header - 縮小比例 */}
                    <header className="px-6 py-4 flex justify-between items-center z-50 shrink-0">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 glass rounded-xl flex items-center justify-center text-white shadow-xl">
                                <Icon name="wind" size={24} />
                            </div>
                            <div>
                                <h1 className="font-black tracking-[0.4em] text-[16px] text-white drop-shadow-md leading-none uppercase">淨化之源</h1>
                                <p className="text-[7px] font-bold text-sky-100/60 uppercase tracking-widest mt-1">Zen Purify: Sea & Sky</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 px-4 py-1.5 glass rounded-full border-white/10 scale-90">
                            <div className={`w-1.5 h-1.5 rounded-full ${status === 'purifying' ? 'bg-orange-400 animate-pulse' : 'bg-white/30'}`} />
                            <span className="text-[9px] font-bold text-sky-100 uppercase tracking-widest leading-none">Presence</span>
                        </div>
                    </header>

                    {/* Main Layout - 核心發洩區最大化 */}
                    <main className="flex-1 flex flex-col px-4 pb-4 max-w-5xl mx-auto w-full z-10 overflow-hidden pt-1">
                        
                        {/* 頂部切換 */}
                        {status !== 'finished' && (
                            <nav className="flex glass p-1 rounded-[24px] mb-3 gap-1 shrink-0">
                                {['text', 'draw', 'image', 'voice'].map(id => (
                                    <button key={id} disabled={status === 'purifying'} 
                                            onClick={id === 'voice' ? handleVoice : () => setMode(id)}
                                            className={`flex-1 flex items-center justify-center gap-2 h-12 rounded-xl text-[11px] font-bold transition-all ${mode === id ? 'tab-active text-[#0369a1]' : 'text-[#bae6fd]'}`}>
                                        <Icon name={id === 'text' ? 'type' : id === 'draw' ? 'pencil' : id === 'image' ? 'image' : 'mic'} size={16}/>
                                        <span className="tracking-widest">{id === 'text' ? '筆耕' : id === 'draw' ? '意繪' : id === 'image' ? '影跡' : '聞聲'}</span>
                                    </button>
                                ))}
                            </nav>
                        )}

                        {/* 祭壇格子 (最大化發洩區) */}
                        <section className={`altar-grid glass border-white/20 relative flex-1 ${status === 'finished' ? 'bg-white/5' : ''}`}>
                            <div className={`golden-horizon ${status === 'purifying' && tools.includes('hole') ? 'horizon-active' : ''}`} />
                            
                            {/* 聖火層 */}
                            {status === 'purifying' && tools.includes('burn') && (
                                <div className="absolute inset-0 z-30 pointer-events-none overflow-hidden">
                                    <div className="absolute bottom-0 left-0 right-0 h-40 bg-gradient-to-t from-orange-500/20 to-transparent" />
                                    {[...Array(30)].map((_, i) => (
                                        <FireParticle key={i} style={{ 
                                            left: `${i * 3.33}%`, 
                                            animationDelay: `${Math.random() * 2}s`,
                                            width: `${70 + Math.random() * 80}px`
                                        }} />
                                    ))}
                                </div>
                            )}

                            {/* 內容顯示：保證置中 */}
                            <div className="absolute inset-0 flex items-center justify-center z-20">
                                {status !== 'finished' ? (
                                    <div className={`w-full h-full flex items-center justify-center transition-all duration-[800ms] ${status === 'purifying' && tools.includes('hole') ? 'bh-vortex' : ''}`}
                                         style={{ 
                                             opacity: (status === 'purifying' && tools.includes('hole')) ? undefined : 1 - (progress / 100),
                                             filter: (status === 'purifying' && tools.includes('hole')) ? undefined : `blur(${progress / 1.5}px)`,
                                             transform: (status === 'purifying' && tools.includes('hole')) ? undefined : `scale(${1 - (progress / 500)})`
                                         }}>
                                        
                                        {(mode === 'text' || mode === 'voice') && (
                                            <textarea className="w-full h-full bg-transparent resize-none outline-none text-4xl md:text-8xl font-light border-none text-white text-center flex items-center justify-center hide-scroll p-12 placeholder:opacity-10"
                                                      placeholder={mode === 'voice' ? "大海在聽..." : "將此時的沉重寫下..."}
                                                      value={text} onChange={(e) => setText(e.target.value)} disabled={status === 'purifying'} />
                                        )}
                                        
                                        {mode === 'draw' && <canvas ref={canvasRef} onMouseDown={startDraw} onTouchStart={startDraw} className="w-full h-full cursor-crosshair" />}
                                        
                                        {mode === 'image' && (
                                            <div className="w-full h-full flex items-center justify-center p-8">
                                                {img ? <img src={img} className="max-w-full max-h-full rounded-[40px] shadow-2xl border-4 border-white/20 object-contain" /> :
                                                    <button onClick={() => document.getElementById('file-in').click()} className="flex flex-col items-center gap-6 p-24 border-2 border-dashed border-white/20 rounded-[80px] text-sky-100 hover:text-white transition-all w-full h-full bg-white/5">
                                                        <Icon name="upload" size={60}/><p className="text-xl font-black uppercase opacity-30 tracking-[0.4em]">上傳煩惱影跡</p>
                                                    </button>
                                                }
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    /* 淨化完畢：正念語錄置中呈現 */
                                    <div className="w-full h-full flex items-center justify-center p-8 fade-in-quote">
                                        <div className="max-w-xl w-full flex flex-col items-center text-center gap-12 bg-white/[0.04] p-16 md:p-20 rounded-[70px] border border-white/10 shadow-2xl overflow-hidden">
                                            <div className="space-y-10 px-4">
                                                <p className="text-3xl md:text-5xl font-light text-white serif-font italic tracking-tighter drop-shadow-2xl leading-relaxed">{zen.cn}</p>
                                                <div className="w-20 h-0.5 bg-white/20 mx-auto rounded-full" />
                                                <p className="text-[14px] font-bold text-sky-200/50 uppercase tracking-[0.8em] leading-relaxed">{zen.en}</p>
                                            </div>
                                            <button onClick={reset} className="mt-8 flex flex-col items-center gap-6 group active:scale-95 transition-all shrink-0">
                                                <div className="w-18 h-18 glass border-white/30 rounded-full flex items-center justify-center shadow-2xl group-hover:bg-white/10 transition-all">
                                                    <Icon name="left" size={36} className="text-white group-hover:-translate-x-1 transition-transform duration-500" />
                                                </div>
                                                <span className="text-[11px] font-black tracking-[0.2em] text-white/40 uppercase leading-none">返回重新開始</span>
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* 聞聲遮罩 - 置中縮小 */}
                            {recording && status === 'input' && (
                                <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-xl z-50 flex items-center justify-center p-6 animate-in fade-in">
                                    <div className="glass max-w-sm w-full p-12 rounded-[50px] flex flex-col items-center gap-10 shadow-2xl border-white/30">
                                        <div className="w-24 h-24 bg-sky-500 rounded-full flex items-center justify-center relative shadow-xl">
                                            <Icon name="mic" size={40} className="text-white z-10" />
                                            <div className="absolute inset-0 rounded-full bg-sky-400/40 mic-ripple" />
                                            <div className="absolute inset-0 rounded-full bg-sky-400/20 mic-ripple" style={{animationDelay: '0.7s'}} />
                                        </div>
                                        <p className="text-sky-100 font-bold tracking-[0.4em] text-xl text-center">正在聆聽...</p>
                                        <button onClick={handleVoice} className="px-12 py-4 bg-white text-[#0c4a6e] rounded-full text-xs font-black active:scale-95 uppercase tracking-widest shadow-xl">完成錄製</button>
                                    </div>
                                </div>
                            )}

                            {/* 意繪工具：懸浮佈置 */}
                            {mode === 'draw' && status === 'input' && (
                                <div className="absolute bottom-10 right-10 flex flex-col items-center gap-6 z-40 animate-in slide-in-from-right">
                                    <div className="flex flex-col gap-5 p-4 glass rounded-full border-white/30 shadow-2xl bg-black/10">
                                        {colors.map(c => (
                                            <button key={c} onClick={() => setBrush(c)}
                                                    className={`w-8 h-8 rounded-full border-2 transition-all ${brush === c ? 'scale-125 border-white shadow-lg' : 'border-white/20 opacity-50'}`}
                                                    style={{ backgroundColor: c }} />
                                        ))}
                                    </div>
                                    <button onClick={() => { canvasRef.current.getContext('2d').clearRect(0,0,canvasRef.current.width,canvasRef.current.height); setDrawn(false); }}
                                            className="p-6 glass text-sky-100 rounded-full active:scale-90 border-white/20 shadow-2xl bg-black/10">
                                        <Icon name="eraser" size={32}/>
                                    </button>
                                </div>
                            )}
                        </section>

                        {/* 底部控制 (10%) */}
                        {status !== 'finished' && (
                            <div className="flex flex-col gap-4 shrink-0 mt-5 animate-in fade-in">
                                <div className="flex justify-center items-center gap-16 glass py-4 border-white/20 rounded-[30px] mb-1">
                                    {['burn', 'hole'].map(id => (
                                        <button key={id} onClick={() => setTools(prev => prev.includes(id) ? (prev.length > 1 ? prev.filter(t => t !== id) : prev) : [...prev, id])} 
                                                className={`flex items-center gap-4 transition-all ${tools.includes(id) ? 'text-orange-300 scale-105' : 'opacity-20 grayscale'}`}>
                                            <div className={`w-12 h-12 rounded-2xl flex items-center justify-center border-2 ${tools.includes(id) ? 'bg-orange-500/20 border-orange-400 shadow-xl' : 'bg-transparent border-white/10 text-white'}`}>
                                                <Icon name={id === 'burn' ? 'flame' : 'orbit'} size={24}/>
                                            </div>
                                            <span className="text-[14px] font-black tracking-widest uppercase leading-none">{id === 'burn' ? '聖火' : '黑洞'}</span>
                                        </button>
                                    ))}
                                </div>
                                <div className="flex gap-4 h-20">
                                    <button disabled={!canStart()} onClick={status === 'purifying' ? () => {} : beginPurify}
                                            className={`flex-1 rounded-[35px] font-black tracking-[1.5em] shadow-2xl flex items-center justify-center gap-5 active:scale-95 disabled:opacity-5 border border-white/20 ${status === 'purifying' ? 'bg-orange-600 text-white animate-pulse' : 'bg-white text-[#0c4a6e]'}`}>
                                        <Icon name={status === 'purifying' ? 'pause' : 'play'} size={28} />
                                        <span className="text-[16px] uppercase leading-none">{status === 'purifying' ? '儀式轉化中' : progress > 0 ? '繼續儀式' : '啟動淨化 / BEGIN'}</span>
                                    </button>
                                    {progress > 0 && <button onClick={reset} className="w-20 glass border-white/20 rounded-[35px] flex items-center justify-center text-white hover:text-red-400 active:scale-90 transition-all shadow-xl"><Icon name="x" size={32}/></button>}
                                </div>
                            </div>
                        )}
                    </main>

                    <input type="file" id="file-in" onChange={(e) => {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = (ev) => { setImg(ev.target.result); setMode('image'); };
                            reader.readAsDataURL(file);
                        }
                    }} accept="image/*" className="hidden" />

                    <footer className="py-4 text-center opacity-5 shrink-0 pointer-events-none">
                        <p className="text-[8px] font-black tracking-[2em] uppercase leading-none text-white">SEA SKY PRESENCE ZEN</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
